<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ActivosLA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0b1220;
            --surface: #171f33;
            --surface2: #212c45;
            --border: #34415c;
            --text: #eef2f8;
            --text2: #cbd5e1;
            --text3: #8b98ae;
            --blue: #3b82f6;
            --blue-soft: #dbeafe;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(720px 480px at 50% -10%, rgba(59, 130, 246, 0.16), transparent 65%),
                linear-gradient(160deg, var(--bg) 0%, #101a30 55%, #0b1220 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -120px;
            left: 50%;
            width: 340px;
            height: 340px;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(59, 130, 246, 0.35), transparent 70%);
            filter: blur(10px);
            pointer-events: none;
            z-index: 0;
        }

        .login-box {
            position: relative;
            z-index: 1;
            background: linear-gradient(180deg, var(--surface) 0%, #141b2c 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 44px 40px;
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.45),
                0 1px 0 rgba(255, 255, 255, 0.04) inset;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.22), rgba(14, 165, 233, 0.12));
            border: 1px solid rgba(59, 130, 246, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-mark svg {
            width: 20px;
            height: 20px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #93c5fd, var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title {
            text-align: center;
            margin-bottom: 28px;
        }

        .title h1 {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.25;
            margin-bottom: 8px;
        }

        .title p {
            color: var(--text3);
            font-size: 14px;
            letter-spacing: -0.005em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        }

        input[type="text"]:hover,
        input[type="password"]:hover {
            border-color: #43536f;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--blue);
            background: rgba(59, 130, 246, 0.06);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.16);
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: var(--text3);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 13px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.005em;
            cursor: pointer;
            transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.15s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--blue);
            color: white;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
        }

        .btn-primary:hover {
            background: #2563eb;
            box-shadow: 0 10px 28px rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .alert {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 11px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: flex;
        }

        .alert.success {
            background: rgba(16, 185, 129, 0.1);
            color: #86efac;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: flex;
        }

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="#93c5fd" stroke-width="1.6"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="#3b82f6" stroke-width="1.6"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="#3b82f6" stroke-width="1.6"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="#93c5fd" stroke-width="1.6"/>
                    </svg>
                </div>
                <div class="logo-text">ActivosLA</div>
            </div>

            <div class="title">
                <h1>Ingresa a tu cuenta</h1>
                <p>Sistema de gestión de activos</p>
            </div>
            
            <div id="alertBox" class="alert"></div>
        
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input 
                        id="username" 
                        type="text" 
                        placeholder="Tu usuario"
                        required
                        autocomplete="username"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        id="password" 
                        type="password" 
                        placeholder="Tu contraseña"
                        required
                        autocomplete="current-password"
                    >
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <span id="btnText">Ingresar</span>
                        <div id="loadingSpinner" class="loading"><span class="spinner"></span>Autenticando...</div>
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        function $(id) {
            return document.getElementById(id);
        }
        
        function showAlert(msg, type = 'info') {
            const box = $('alertBox');
            box.textContent = msg;
            box.className = `alert ${type}`;
            if (type !== 'success') return;
            setTimeout(() => { box.className = 'alert'; }, 3000);
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = $('username').value.trim();
            const password = $('password').value.trim();
            
            if (!username || !password) {
                showAlert('Usuario y contraseña son requeridos', 'error');
                return;
            }
            
            // Mostrar loading
            $('btnText').style.display = 'none';
            $('loadingSpinner').style.display = 'block';
            $('loginForm').style.opacity = '0.6';
            $('loginForm').style.pointerEvents = 'none';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Error al autenticarse');
                }
                
                const nextUrl = new URLSearchParams(window.location.search).get('next') || '/';
                window.location.href = nextUrl;
                
            } catch (err) {
                showAlert('❌ ' + err.message, 'error');
                $('btnText').style.display = 'inline';
                $('loadingSpinner').style.display = 'none';
                $('loginForm').style.opacity = '1';
                $('loginForm').style.pointerEvents = 'auto';
            }
        }
        
        // Focus en username al cargar
        window.addEventListener('load', () => {
            $('username').focus();
        });
    </script>
</body>
</html>
